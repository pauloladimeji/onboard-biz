  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all .12s;
}
.ar-tab:hover { background: var(--row-hover); }
.ar-tab.on {
  background: #F8FAFE;
  border-color: var(--info-700);
  box-shadow: 0 0 0 3px rgba(29,78,216,.08);
}
.ar-tab .ic {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--gray-100); color: var(--gray-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.ar-tab .ic svg { width: 18px; height: 18px; }
.ar-tab.on .ic { background: var(--info-700); color: #fff; }
.ar-tab .meta { flex: 1; min-width: 0; }
.ar-tab .meta .t { font-size: 13.5px; font-weight: 500; color: var(--gray-900); }
.ar-tab .meta .s { font-size: 11.5px; color: var(--gray-600); margin-top: 2px; }

/* currency grid (after country pick) */
.ar-ccy-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.ar-ccy {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  transition: all .12s;
}
.ar-ccy:hover { background: var(--row-hover); }
.ar-ccy.on {
  background: #F8FAFE;
  border-color: var(--info-700);
  box-shadow: 0 0 0 3px rgba(29,78,216,.08);
}
.ar-ccy .ic {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--gray-100); color: var(--gray-800);
  display: grid; place-items: center; flex-shrink: 0;
  font-size: 13px; font-weight: 600;
}
.ar-ccy.on .ic { background: var(--info-700); color: #fff; }
.ar-ccy .meta { flex: 1; min-width: 0; }
.ar-ccy .meta .t {
  font-size: 13.5px; font-weight: 500; color: var(--gray-900);
  font-variant-numeric: tabular-nums;
}
.ar-ccy .meta .s { font-size: 11.5px; color: var(--gray-600); margin-top: 2px; }
.ar-ccy .selected-mark {
  width: 20px; height: 20px; border-radius: 999px;
  background: var(--info-700);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.ar-ccy .selected-mark svg { width: 12px; height: 12px; stroke: #fff; color: #fff; }

/* compliance banner */
.ar-compliance {
  display: flex; align-items: flex-start; gap: 12px;
  margin-top: 16px;
  padding: 14px 16px;
  background: #FFFBEB;
  border: 1px solid #FCD34D;
  border-radius: 12px;
}
.ar-compliance .ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: #FEF3C7; color: #B45309;
  display: grid; place-items: center; flex-shrink: 0;
}
.ar-compliance .ic svg { width: 16px; height: 16px; }
.ar-compliance .meta { flex: 1; min-width: 0; }
.ar-compliance .meta .t { font-size: 13px; font-weight: 600; color: #92400E; }
.ar-compliance .meta .s { font-size: 12px; color: var(--gray-700); margin-top: 3px; line-height: 1.5; }
.ar-compliance .btn { flex-shrink: 0; align-self: center; text-decoration: none; }

/* section label inside add-recipient flow */
.ar-section-label {
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--gray-700); text-transform: uppercase;
  margin: 22px 0 4px;
}

/* small inline "verified" badge in review */
.ar-namebadge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px; font-weight: 500;
  margin-left: 8px;
}
.ar-namebadge.ok { background: #ECFDF5; color: var(--success-700); }
.ar-namebadge svg { width: 11px; height: 11px; }

/* ---------- TRANSACTIONS ---------- */
.tx-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}
.tx-stat {
  background: #fff;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-card);
  padding: 14px 16px;
}
.tx-stat .v {
  font-size: 22px; font-weight: 600; color: var(--gray-900);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}
.tx-stat .l {
  font-size: 11.5px; color: var(--gray-600);
  text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
  margin-top: 4px;
}
.tx-stat.warn   .v { color: #A16207; }
.tx-stat.danger .v { color: var(--danger-700); }

.tx-filterbar {
  display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 14px 16px;
  background: #fff;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-card);
}
.tx-search {
  flex: 1 1 280px;
  min-width: 220px;
  position: relative;
}
.tx-search svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; color: var(--gray-500);
}
.tx-search input {
  width: 100%;
  padding: 9px 12px 9px 34px;
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  font-size: 13px; outline: none;
  background: var(--bg-canvas);
}
.tx-search input:focus {
  border-color: var(--info-700);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(29,78,216,.10);
}

.tx-filtergroup { display: flex; flex-direction: column; gap: 6px; }
.tx-filtergroup .lbl {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--gray-600); text-transform: uppercase;
}
.tx-select-wrap {
  position: relative;
  display: inline-block;
}
.tx-select {
  appearance: none;
  -webkit-appearance: none;
  padding: 8px 30px 8px 12px;
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  background: #fff;
  font-size: 13px; color: var(--gray-900);
  font-family: inherit;
  cursor: pointer;
  outline: none;
  min-width: 150px;
}
.tx-select:hover { border-color: var(--gray-400); }
.tx-select:focus {
  border-color: var(--info-700);
  box-shadow: 0 0 0 3px rgba(29,78,216,.10);
}
.tx-select-wrap > svg {
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px;
  color: var(--gray-500);
  pointer-events: none;
}
.tx-clearfilters {
  align-self: flex-end;
  padding: 8px 12px;
  background: transparent;
  border: 0;
  font-size: 12.5px; color: var(--info-700); font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.tx-clearfilters:hover { text-decoration: underline; }

/* ---------- RECIPIENTS LIST (rebuilt) ---------- */
.rc-list { display: flex; flex-direction: column; }
.rc-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1.5fr) 110px 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 14px 24px;
  cursor: pointer;
  border-top: 1px solid var(--gray-100);
  transition: background-color .12s;
}
.rc-row:hover { background: var(--row-hover); }
.rc-row .ava {
  width: 36px; height: 36px; border-radius: 999px;
  background: linear-gradient(135deg, #5433FF, #321F99);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px;
}
.rc-row .meta { min-width: 0; }
.rc-row .meta .t {
  font-size: 13.5px; font-weight: 500; color: var(--gray-900);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rc-row .meta .s {
  font-size: 12px; color: var(--gray-600); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rc-row .ccy-cell {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; font-weight: 500; color: var(--gray-900);
}
.rc-row .last-cell {
  font-size: 12px; color: var(--gray-600);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rc-row .actions { display: flex; align-items: center; gap: 6px; }
.rc-row .rc-pay {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  font-size: 12px; font-weight: 500;
  background: transparent;
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  color: var(--gray-700);
  cursor: pointer;
  font-family: inherit;
  opacity: 0;
  transition: opacity .12s, background-color .12s, color .12s;
}
.rc-row:hover .rc-pay { opacity: 1; }
.rc-row .rc-pay:hover { background: var(--info-700); color: #fff; border-color: var(--info-700); }
.rc-row .rc-pay svg { width: 13px; height: 13px; }
.rc-row .rc-iconbtn {
  width: 28px; height: 28px; border-radius: 8px;
  background: transparent; border: 0;
  color: var(--gray-500);
  cursor: pointer;
  font-family: inherit;
  display: grid; place-items: center;
  opacity: 0;
  transition: opacity .12s, background-color .12s;
}
.rc-row:hover .rc-iconbtn { opacity: 1; }
.rc-row .rc-iconbtn:hover { background: var(--gray-100); color: var(--gray-700); }
.rc-row .rc-iconbtn .dots { font-size: 16px; line-height: 1; letter-spacing: -1px; }

/* ---------- TX HERO label rows + inline timeline ---------- */
.td-flow .leg .lbl-row {
  display: inline-flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.td-flow .leg.right .lbl-row { justify-content: flex-end; }
.td-flow .leg .lbl-row .lbl { margin-bottom: 0; }
.td-flow .leg .lbl-row .ccy-flag {
  box-shadow: inset 0 0 0 1px rgba(15,23,42,.08);
}

.td-stamps {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--gray-100);
  display: flex; align-items: center; gap: 12px;
}
.td-stamp {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px;
}
.td-stamp svg { width: 14px; height: 14px; }
.td-stamp .pulse {
  width: 8px; height: 8px; border-radius: 999px;
  background: var(--info-700);
  animation: pulse 1.4s ease-in-out infinite;
}
.td-stamp .t { font-weight: 500; color: var(--gray-900); }
.td-stamp .s { color: var(--gray-600); }
.td-stamp.done svg { color: var(--success-700); }
.td-stamp.active .t { color: var(--info-700); }
.td-stamp.fail svg { color: var(--danger-700); }
.td-stamp.fail .t  { color: var(--danger-700); }
.td-stamp-bar {
  flex: 1;
  height: 1px;
  background: var(--gray-200);
  max-width: 120px;
}

/* ---------- TRANSACTION DETAILS ---------- */
.td-flow {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 24px;
  align-items: center;
}
.td-flow .leg .lbl {
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
  color: var(--gray-600); text-transform: uppercase;
  margin-bottom: 8px;
}
.td-flow .leg .big {
  font-size: 24px; font-weight: 600; color: var(--gray-900);
  font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
.td-flow .leg .big .num { font-weight: 600; }
.td-flow .leg .sub {
  font-size: 12.5px; color: var(--gray-600);
  margin-top: 6px;
}
.td-flow .leg .sub .ccy-flag { vertical-align: -2px; margin-right: 4px; }
.td-flow .leg .sub strong { color: var(--gray-900); font-weight: 500; }
.td-flow .leg.right { text-align: right; }
.td-flow .leg.right .big { justify-content: flex-end; }
.td-flow .leg.right .sub { justify-content: flex-end; }
.td-arrow {
  width: 36px; height: 36px; border-radius: 999px;
  background: var(--info-100); color: var(--info-700);
  display: grid; place-items: center;
}
.td-arrow svg { width: 16px; height: 16px; }

.td-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 22px;
}
@media (max-width: 1080px) {
  .td-grid { grid-template-columns: 1fr; }
  .td-flow { grid-template-columns: 1fr; gap: 12px; }
  .td-flow .leg.right { text-align: left; }
  .td-flow .leg.right .big, .td-flow .leg.right .sub { justify-content: flex-start; }
  .td-arrow { transform: rotate(90deg); }
}

.copy-inline {
  margin-left: 8px;
  width: 22px; height: 22px;
  background: transparent;
  border: 0; padding: 0;
  display: inline-grid; place-items: center;
  border-radius: 6px;
  color: var(--gray-500);
  cursor: pointer;
  vertical-align: middle;
}
.copy-inline:hover { background: var(--gray-100); color: var(--info-700); }
.copy-inline svg { width: 13px; height: 13px; }

.td-timeline {
  display: flex; flex-direction: column;
  margin-bottom: 14px;
}
.td-tl-row {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 14px;
  position: relative;
  padding-bottom: 18px;
}
.td-tl-row:last-child { padding-bottom: 0; }
.td-tl-row::before {
  content: "";
  position: absolute;
  left: 13px; top: 22px; bottom: 0;
  width: 2px; background: var(--gray-200);
}
.td-tl-row:last-child::before { display: none; }
.td-tl-row .dot {
  width: 28px; height: 28px; border-radius: 999px;
  background: var(--gray-100);
  display: grid; place-items: center;
  z-index: 1;
}
.td-tl-row .dot svg { width: 14px; height: 14px; color: var(--gray-500); }
.td-tl-row .dot .ring {
  width: 10px; height: 10px; border-radius: 999px;
  border: 2px solid var(--gray-300);
}
.td-tl-row .dot .pulse {
  width: 10px; height: 10px; border-radius: 999px;
  background: var(--info-700);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(29,78,216,.4); }
  50%      { box-shadow: 0 0 0 8px rgba(29,78,216,0); }
}
.td-tl-row.done .dot { background: var(--success-100); }
.td-tl-row.done .dot svg { color: var(--success-700); }
.td-tl-row.active .dot { background: var(--info-100); }
.td-tl-row.fail .dot { background: var(--danger-100); }
.td-tl-row.fail .dot svg { color: var(--danger-700); }
.td-tl-row .meta .t {
  font-size: 13px; color: var(--gray-900); font-weight: 500;
}
.td-tl-row.done .meta .t { color: var(--gray-900); }
.td-tl-row:not(.done):not(.active):not(.fail) .meta .t { color: var(--gray-600); }
.td-tl-row .meta .s {
  font-size: 11.5px; color: var(--gray-600); margin-top: 2px;
}

.td-banner {
  margin-top: 8px;
  padding: 12px 14px;
  border-radius: 10px;
  display: flex; gap: 12px; align-items: flex-start;
}
.td-banner svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.td-banner .t { font-size: 12.5px; font-weight: 600; }
.td-banner .s { font-size: 11.5px; margin-top: 3px; line-height: 1.5; }
.td-banner.info { background: var(--info-100); color: var(--info-700); }
.td-banner.info .s { color: var(--gray-700); }
.td-banner.danger { background: var(--danger-100); color: var(--danger-700); }
.td-banner.danger .s { color: var(--gray-700); }

.td-money { display: flex; flex-direction: column; }
.td-money .row {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--gray-100);
}
.td-money .row:last-child { border-bottom: 0; }
.td-money .row .k { font-size: 12.5px; color: var(--gray-700); }
.td-money .row .v {
  font-size: 13px; color: var(--gray-900);
  font-variant-numeric: tabular-nums;
}
.td-money .row .v .num { font-weight: 500; }
.td-money .row.sub .k { color: var(--gray-500); padding-left: 10px; font-size: 12px; }
.td-money .row.sub .v { color: var(--gray-600); font-size: 12.5px; }
.td-money .row.total {
  border-top: 1px solid var(--gray-200);
  border-bottom: 0;
  margin-top: 6px;
  padding-top: 14px;
}
.td-money .row.total .k { font-weight: 600; color: var(--gray-900); }
.td-money .row.total .v { font-weight: 600; font-size: 15px; }

/* Breakdown — sent − fee = debited × rate = recipient gets */
.td-breakdown { display: flex; flex-direction: column; }
.td-breakdown .bd-row,
.td-breakdown .bd-eq {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 10px 0;
}
.td-breakdown .bd-k {
  font-size: 12.5px; color: var(--gray-700);
}
.td-breakdown .bd-v {
  font-size: 13px; color: var(--gray-900);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.td-breakdown .bd-v.strong {
  font-weight: 600;
  font-size: 15px;
}
.td-breakdown .bd-eq {
  border-top: 1px dashed var(--gray-300);
  margin-top: 2px;
}
.td-breakdown .bd-eq .bd-k {
  font-weight: 600; color: var(--gray-900);
}
.td-breakdown .bd-eq.final {
  border-top: 1px solid var(--gray-300);
  margin-top: 4px;
  padding-top: 14px;
}
.td-breakdown .bd-eq.final .bd-k {
  font-size: 13px;
}
.td-breakdown .bd-eq.final .bd-v.strong {
  font-size: 17px;
  color: var(--gray-900);
}
.td-breakdown .bd-op {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  align-items: baseline;
  gap: 10px;
  padding: 6px 0 8px;
  color: var(--gray-600);
}
.td-breakdown .bd-op .op {
  font-size: 16px; font-weight: 500;
  color: var(--gray-500);
  text-align: center;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.td-breakdown .bd-op .op-lbl {
  font-size: 12px; color: var(--gray-600);
}
.td-breakdown .bd-op .op-v {
  font-size: 12.5px;
  color: var(--gray-700);
}

.td-actions { display: flex; flex-direction: column; gap: 6px; }
.td-action {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  background: transparent;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: background-color .12s, border-color .12s;
}
.td-action:hover { background: var(--row-hover); border-color: var(--gray-300); }
.td-action .ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--info-100); color: var(--info-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.td-action .ic svg { width: 15px; height: 15px; }
.td-action .t {
  flex: 1; min-width: 0;
  font-size: 13px; color: var(--gray-900); font-weight: 500;
}
.td-action > svg { width: 14px; height: 14px; color: var(--gray-500); }

/* ---------- RECIPIENTS LIST ---------- */
.rc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1px;
  background: var(--gray-200);
  padding: 1px 0;
}
.rc-card {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  background: #fff;
  cursor: pointer;
  transition: background-color .12s;
}
.rc-card:hover { background: var(--row-hover); }
.rc-card .ava {
  position: relative;
  width: 38px; height: 38px; border-radius: 999px;
  background: linear-gradient(135deg, #5433FF, #321F99);
  color: #fff;
  display: grid; place-items: center;
  font-weight: 600; font-size: 12px;
  flex-shrink: 0;
}
.rc-card .ava .ccy-flag {
  position: absolute; right: -2px; bottom: -2px;
  box-shadow: inset 0 0 0 1px rgba(15,23,42,.08), 0 0 0 2px #fff;
}
.rc-card .meta { flex: 1; min-width: 0; }
.rc-card .meta .t { font-size: 13.5px; font-weight: 500; color: var(--gray-900); }
.rc-card .meta .s {
  font-size: 11.5px; color: var(--gray-600); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rc-card .rt { text-align: right; flex-shrink: 0; }
.rc-card .rt .ccy {
  font-size: 12px; font-weight: 600; color: var(--gray-900);
}
.rc-card .rt .last {
  font-size: 11px; color: var(--gray-500); margin-top: 2px;
}
.rc-pay {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  font-size: 12px; font-weight: 500;
  background: transparent;
  border: 1px solid var(--gray-300);
  border-radius: 8px;
  color: var(--gray-700);
  cursor: pointer;
  font-family: inherit;
  flex-shrink: 0;
  opacity: 0;
  transition: opacity .12s, background-color .12s, color .12s;
}
.rc-card:hover .rc-pay { opacity: 1; }
.rc-pay:hover { background: var(--info-700); color: #fff; border-color: var(--info-700); }
.rc-pay svg { width: 13px; height: 13px; }


/* =====================================================
   SETTINGS  ·  Subnav rail + content
   ===================================================== */
.settings-shell {
  display: grid;
  grid-template-columns: 248px 1fr;
  gap: 28px;
  align-items: start;
  margin-top: 8px;
}
@media (max-width: 880px) {
  .settings-shell { grid-template-columns: 1fr; }
}

.settings-rail {
  display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 24px;
}
.settings-rail-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  color: var(--gray-700);
  transition: background-color .1s, color .1s;
}
.settings-rail-item:hover { background: var(--row-hover); color: var(--gray-900); }
.settings-rail-item.on {
  background: var(--info-100);
  color: var(--info-700);
}
.settings-rail-item .ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--gray-100); color: var(--gray-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.settings-rail-item .ic svg { width: 16px; height: 16px; }
.settings-rail-item.on .ic { background: var(--info-700); color: #fff; }
.settings-rail-item .meta { display: flex; flex-direction: column; min-width: 0; }
.settings-rail-item .meta .t {
  font-size: 13.5px; font-weight: 500;
}
.settings-rail-item .meta .s {
  font-size: 11.5px; color: var(--gray-600); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.settings-rail-item.on .meta .s { color: var(--info-700); opacity: 0.75; }

.settings-body { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* ----- Cards ----- */
.set-card {
  background: #fff;
  border: 1px solid var(--gray-200);
  border-radius: var(--radius-sm);
  padding: 22px 24px;
}
.set-card-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.set-card-head:last-child { margin-bottom: 0; }
.set-card-title { margin: 0; font-size: 15.5px; font-weight: 600; color: var(--gray-900); }
.set-card-sub { margin: 4px 0 0; font-size: 12.5px; color: var(--gray-600); line-height: 1.5; max-width: 60ch; }

.set-list { display: flex; flex-direction: column; }
.set-row {
  display: grid;
  grid-template-columns: 200px 1fr auto;
  gap: 16px;
  align-items: center;
  padding: 14px 0;
  border-top: 1px solid var(--gray-100);
}
.set-row:first-child { border-top: 0; padding-top: 4px; }
.set-row:last-child  { padding-bottom: 4px; }
.set-row-k {
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--gray-600);
}
.set-row-v { min-width: 0; }
.set-row-v .strong { font-size: 14px; font-weight: 500; color: var(--gray-900); }
.set-row-help {
  font-size: 11.5px; color: var(--gray-600); margin-top: 4px;
  display: inline-flex; align-items: center; gap: 6px;
}
.set-row-help svg { width: 12px; height: 12px; }
.set-row-edit {
  background: transparent; border: 0; cursor: pointer;
  font-size: 12.5px; font-weight: 500; color: var(--info-700);
  padding: 6px 10px; border-radius: 6px;
  font-family: inherit;
}
.set-row-edit:hover { background: var(--info-100); }

.set-address {
  font-size: 14px; color: var(--gray-900); line-height: 1.7;
  background: var(--gray-50, #F8FAFC);
  border: 1px solid var(--gray-100);
  border-radius: 8px;
  padding: 14px 16px;
}

/* ----- Banner (KYB status) ----- */
.set-banner {
  display: flex; align-items: center; gap: 16px;
  padding: 18px 22px;
  border-radius: 12px;
  border: 1px solid var(--gray-200);
  background: #fff;
}
.set-banner .ic {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--gray-100); color: var(--gray-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.set-banner .ic svg { width: 22px; height: 22px; }
.set-banner .meta { flex: 1; min-width: 0; }
.set-banner .meta .t { font-size: 15px; font-weight: 600; color: var(--gray-900); }
.set-banner .meta .s { font-size: 12.5px; color: var(--gray-700); margin-top: 4px; line-height: 1.5; }
.set-banner.ok     { background: #ECFDF5; border-color: #A7F3D0; }
.set-banner.ok .ic { background: var(--success-700); color: #fff; }
.set-banner.ok .meta .t { color: var(--success-700); }
.set-banner.info   { background: var(--info-100); border-color: #BFDBFE; }
.set-banner.info .ic { background: var(--info-700); color: #fff; }
.set-banner.info .meta .t { color: var(--info-700); }
.set-banner.warn   { background: #FFFBEB; border-color: #FDE68A; }
.set-banner.warn .ic { background: #B45309; color: #fff; }
.set-banner.warn .meta .t { color: #92400E; }
.set-banner.warn .meta .s { color: #92400E; }
.set-banner.danger { background: var(--danger-100); border-color: #FECACA; }
.set-banner.danger .ic { background: var(--danger-700); color: #fff; }
.set-banner.danger .meta .t { color: var(--danger-700); }

/* ----- Doc list (KYB & sessions) ----- */
.set-doclist { display: flex; flex-direction: column; gap: 10px; }
.set-doc {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  background: #fff;
}
.set-doc .ic {
  width: 36px; height: 36px; border-radius: 8px;
  background: var(--gray-100); color: var(--gray-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.set-doc .ic svg { width: 18px; height: 18px; }
.set-doc.approved .ic { background: var(--success-100, #DCFCE7); color: var(--success-700); }
.set-doc.rejected .ic { background: var(--danger-100); color: var(--danger-700); }
.set-doc.missing  .ic { background: #FEF3C7; color: #92400E; }
.set-doc .meta { flex: 1; min-width: 0; }
.set-doc .meta .t {
  font-size: 13.5px; font-weight: 500; color: var(--gray-900);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.set-doc .meta .s { font-size: 11.5px; color: var(--gray-600); margin-top: 3px; }

.set-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11.5px; font-weight: 500;
  background: var(--gray-100); color: var(--gray-700);
  white-space: nowrap;
}
.set-chip svg { width: 12px; height: 12px; }
.set-chip.ok     { background: var(--success-100, #DCFCE7); color: var(--success-700); }
.set-chip.warn   { background: #FEF3C7; color: #92400E; }
.set-chip.danger { background: var(--danger-100); color: var(--danger-700); }
.set-pill {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10.5px; font-weight: 500;
  background: var(--info-100); color: var(--info-700);
  letter-spacing: 0.02em;
}

/* ----- Switch ----- */
.set-switch {
  width: 40px; height: 22px; border-radius: 999px;
  background: var(--gray-300);
  border: 0; padding: 0;
  cursor: pointer; position: relative;
  transition: background-color .15s;
  flex-shrink: 0;
}
.set-switch .knob {
  position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 999px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  transition: left .15s;
}
.set-switch.on { background: var(--info-700); }
.set-switch.on .knob { left: 20px; }

.set-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--gray-100);
}

/* ----- 2FA method selector ----- */
.set-2fa-methods { display: flex; flex-direction: column; gap: 10px; }
.set-2fa-method {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--gray-200);
  border-radius: 12px;
  background: #fff;
  cursor: pointer; text-align: left;
  font-family: inherit;
  transition: all .12s;
}
.set-2fa-method:hover { background: var(--row-hover); }
.set-2fa-method.on {
  border-color: var(--info-700);
  background: #F8FAFE;
  box-shadow: 0 0 0 3px rgba(29,78,216,.08);
}
.set-2fa-method .ic {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--info-100); color: var(--info-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.set-2fa-method .ic svg { width: 18px; height: 18px; }
.set-2fa-method.on .ic { background: var(--info-700); color: #fff; }
.set-2fa-method .meta { flex: 1; min-width: 0; }
.set-2fa-method .meta .t {
  font-size: 13.5px; font-weight: 500; color: var(--gray-900);
  display: flex; align-items: center; gap: 8px;
}
.set-2fa-method .meta .s {
  font-size: 11.5px; color: var(--gray-600); margin-top: 3px;
}
.set-method-on {
  width: 22px; height: 22px; border-radius: 999px;
  background: var(--info-700); color: #fff;
  display: grid; place-items: center; flex-shrink: 0;
}
.set-method-on svg { width: 13px; height: 13px; }

/* ----- TOTP setup modal ----- */
.set-modal-bg {
  position: fixed; inset: 0;
  background: rgba(15,23,42,.45);
  display: grid; place-items: center;
  z-index: 1000;
  padding: 24px;
  animation: fadein .15s ease-out;
}
@keyframes fadein { from { opacity: 0 } to { opacity: 1 } }
.set-modal {
  background: #fff;
  border-radius: 16px;
  width: 100%; max-width: 460px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(15,23,42,.25);
}
.set-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.set-modal-head h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--gray-900); }
.set-modal-x {
  background: transparent; border: 0; cursor: pointer;
  font-size: 22px; line-height: 1; color: var(--gray-600);
  padding: 4px 8px; border-radius: 6px;
}
.set-modal-x:hover { background: var(--gray-100); color: var(--gray-900); }
.set-modal-steps {
  margin: 0 0 18px; padding-left: 22px;
  font-size: 13px; color: var(--gray-700); line-height: 1.7;
}
.set-totp-qr {
  display: flex; align-items: center; gap: 18px;
  padding: 18px;
  background: var(--gray-50, #F8FAFC);
  border: 1px solid var(--gray-100);
  border-radius: 10px;
}
.set-qr {
  background: #fff;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
  flex-shrink: 0;
}
.set-totp-key { flex: 1; min-width: 0; }
.set-totp-key .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
.set-modal-foot {
  display: flex; justify-content: flex-end; gap: 10px;
  margin-top: 20px;
}

/* ----- Notifications table ----- */
.set-notif-table {
  display: grid;
  grid-template-columns: 1fr 80px 80px;
  align-items: center;
}
.set-notif-head {
  display: contents;
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--gray-600);
}
.set-notif-head > div {
  padding: 0 0 10px;
  border-bottom: 1px solid var(--gray-200);
}
.set-notif-head > div:nth-child(2),
.set-notif-head > div:nth-child(3) { text-align: center; }

.set-notif-grouphead {
  grid-column: 1 / -1;
  padding: 18px 0 8px;
}
.set-notif-grouphead .t {
  font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
  text-transform: uppercase; color: var(--gray-700);
}
.set-notif-grouphead .s {
  font-size: 12px; color: var(--gray-600); margin-top: 4px;
}

.set-notif-row {
  display: contents;
}
.set-notif-row > div {
  padding: 14px 0;
  border-top: 1px solid var(--gray-100);
}
.set-notif-row > div:nth-child(2),
.set-notif-row > div:nth-child(3) {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.set-notif-row > div:first-child .t {
  font-size: 13.5px; font-weight: 500; color: var(--gray-900);
}
.set-notif-row > div:first-child .s {
  font-size: 12px; color: var(--gray-600); margin-top: 3px; line-height: 1.5;
}

/* ----- Locked state on profile rows ----- */
.set-row.locked .set-row-v .strong { color: var(--gray-700); }

/* ----- Add Currency modal ----- */
.addccy-bg {
  position: fixed; inset: 0; background: rgba(15,23,42,.45);
  display: grid; place-items: center; z-index: 60; padding: 24px;
}
.addccy {
  position: relative;
  background: #fff; border-radius: 16px;
  width: min(520px, 100%); max-height: 88vh; overflow: auto;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(15,23,42,.25);
}
.addccy-x {
  position: absolute; top: 14px; right: 14px;
  background: transparent; border: 0; cursor: pointer;
  font-size: 24px; line-height: 1; color: var(--gray-600);
  padding: 4px 10px; border-radius: 8px;
}
.addccy-x:hover { background: var(--gray-100); color: var(--gray-900); }
.addccy-head h3 { margin: 0 40px 8px 0; font-size: 19px; font-weight: 600; color: var(--gray-900); }
.addccy-head p  { margin: 0 0 20px; font-size: 13px; color: var(--gray-600); line-height: 1.55; }
.addccy-search {
  position: relative; margin-bottom: 14px;
}
.addccy-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--gray-500); }
.addccy-search input {
  width: 100%; padding: 10px 12px 10px 36px;
  border: 1px solid var(--gray-300, #CBD5E1); border-radius: 10px;
  font-size: 13.5px; font-family: inherit; color: var(--gray-900);
  background: #fff;
}
.addccy-search input:focus { outline: none; border-color: var(--info-700); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
.addccy-flag {
  width: 32px; height: 32px; border-radius: 999px;
  background-size: cover; background-position: center;
  background-repeat: no-repeat; background-color: var(--gray-100);
  box-shadow: inset 0 0 0 1px rgba(15,23,42,.08);
  flex-shrink: 0;
}
.addccy-flag.lg { width: 44px; height: 44px; }
.addccy-list { display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow: auto; margin: 0 -8px; padding: 0 8px; }
.addccy-opt {
  display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left;
  padding: 12px; border: 0; background: transparent;
  border-radius: 10px; cursor: pointer; font-family: inherit;
  transition: background .1s;
}
.addccy-opt:hover { background: var(--gray-50, #F8FAFC); }
.addccy-opt > svg { width: 16px; height: 16px; color: var(--gray-500); flex-shrink: 0; }
.addccy-opt .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.addccy-opt .t { font-size: 14px; font-weight: 500; color: var(--gray-900); }
.addccy-opt .t .code { color: var(--gray-500); font-weight: 500; margin-left: 6px; font-size: 12.5px; }
.addccy-opt .s { font-size: 12px; color: var(--gray-600); }
.addccy-empty { padding: 32px 16px; text-align: center; color: var(--gray-600); font-size: 13px; }
.addccy-foot-note {
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--gray-100);
  font-size: 12.5px; color: var(--gray-600); text-align: center;
}
.addccy-foot-note a { color: var(--info-700); font-weight: 500; text-decoration: none; }
.addccy-foot-note a:hover { text-decoration: underline; }

.addccy-confirm { display: flex; flex-direction: column; gap: 16px; }
.addccy-confirm .row { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--gray-50, #F8FAFC); border-radius: 12px; }
.addccy-confirm .row .t { font-size: 15px; font-weight: 600; color: var(--gray-900); }
.addccy-confirm .row .s { font-size: 12.5px; color: var(--gray-600); margin-top: 2px; }
.addccy-list-rows { display: flex; flex-direction: column; }
.addccy-list-rows > div { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; border-top: 1px solid var(--gray-100); font-size: 13px; }
.addccy-list-rows > div:first-child { border-top: 0; }
.addccy-list-rows > div span { color: var(--gray-600); }
.addccy-list-rows > div strong { color: var(--gray-900); font-weight: 500; }
.addccy-tip {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 12px 14px; background: var(--info-100); border-radius: 10px;
  font-size: 12.5px; color: var(--info-700); line-height: 1.5;
}
.addccy-tip svg { width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px; }
.addccy-tip span { flex: 1; min-width: 0; }
.addccy-success .ic.processing {
  background: #EDE9FE; color: #7C3AED;
}
.addccy-success .ic.processing svg { animation: addccy-spin 2.2s linear infinite; }
@keyframes addccy-spin { to { transform: rotate(360deg); } }
.addccy-progress {
  height: 4px; border-radius: 999px; background: var(--gray-100);
  overflow: hidden; max-width: 280px; margin: 14px auto 4px;
}
.addccy-progress span {
  display: block; height: 100%; width: 40%; border-radius: 999px;
  background: linear-gradient(90deg, transparent, #A78BFA, transparent);
  animation: addccy-progress 1.6s ease-in-out infinite;
}
@keyframes addccy-progress {
  0%   { transform: translateX(-100%); }
  100% { transform: translateX(250%); }
}

.addccy-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

.addccy-success { text-align: center; padding: 12px 0 4px; }
.addccy-success .ic {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--success-100, #DCFCE7); color: var(--success-700);
  display: grid; place-items: center; margin: 0 auto 16px;
}
.addccy-success .ic svg { width: 28px; height: 28px; }
.addccy-success h3 { margin: 0 0 8px; font-size: 19px; font-weight: 600; color: var(--gray-900); }
.addccy-success p { margin: 0 0 8px; font-size: 13px; color: var(--gray-600); line-height: 1.6; max-width: 360px; margin-inline: auto; }

/* ----- TOTP status row ----- */
.set-totp-status {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 18px;
  background: var(--gray-50, #F8FAFC);
  border: 1px solid var(--gray-200);
  border-radius: 12px;
}
.set-totp-status .ic {
  width: 40px; height: 40px; border-radius: 10px;
  background: #fff; border: 1px solid var(--gray-200);
  color: var(--info-700);
  display: grid; place-items: center; flex-shrink: 0;
}
.set-totp-status .ic svg { width: 18px; height: 18px; }
.set-totp-status .meta { flex: 1; min-width: 0; }
.set-totp-status .meta .t { font-size: 14px; font-weight: 500; color: var(--gray-900); }
.set-totp-status .meta .s { font-size: 12px; color: var(--gray-600); margin-top: 3px; line-height: 1.5; }

/* ----- Support note (footer) ----- */
.set-support-note {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 18px;
  background: var(--gray-50, #F8FAFC);
  border: 1px dashed var(--gray-300, #CBD5E1);
  border-radius: 12px;
  font-size: 12.5px; color: var(--gray-700); line-height: 1.55;
}
.set-support-note > svg { width: 18px; height: 18px; color: var(--gray-600); flex-shrink: 0; margin-top: 1px; }
.set-support-note a { color: var(--info-700); font-weight: 500; text-decoration: none; }
.set-support-note a:hover { text-decoration: underline; }

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>

<script type="text/babel" data-file="combobox.jsx">
/* global React */
/*
 * Combobox — searchable dropdown.
 * Props:
 *   value          (any) — selected value
 *   onChange       (fn)  — (val, item) => void
 *   options        ([{ value, label, sub?, leading?, disabled?, search? }])
 *   placeholder    (str) — shown when nothing selected
 *   searchPlaceholder (str)
 *   renderTrigger  (fn?)  — custom trigger renderer (item, open) => ReactNode
 *   renderOption   (fn?)  — custom option renderer (item, isSelected) => ReactNode
 *   emptyText      (str)
 *   width          (str|num) — applied to the trigger button (default 100%)
 *   id             (str?) — used for aria
 */
const { useState: cbUseState, useEffect: cbUseEffect, useRef: cbUseRef, useMemo: cbUseMemo } = React;
const cbIcon = window.OBIcon;

window.OBCombobox = function Combobox(props) {
  const {
    value,
    onChange,
    options = [],
    placeholder = "Select…",
    searchPlaceholder = "Search…",
    renderTrigger,
    renderOption,
    emptyText = "No matches.",
    width = "100%",
    disabled = false,
    locked = false,
  } = props;

  const [open, setOpen] = cbUseState(false);
  const [q, setQ] = cbUseState("");
  const [highlight, setHighlight] = cbUseState(0);
  const wrapRef = cbUseRef(null);
  const listRef = cbUseRef(null);
  const searchRef = cbUseRef(null);

  const selected = cbUseMemo(
    () => options.find((o) => o.value === value) || null,
    [options, value]
  );

  const filtered = cbUseMemo(() => {
    if (!q.trim()) return options;
    const needle = q.trim().toLowerCase();
    return options.filter((o) => {
      const hay = (o.search || `${o.label || ""} ${o.sub || ""}`).toLowerCase();
      return hay.includes(needle);
    });
  }, [options, q]);

  // Close on outside click
  cbUseEffect(() => {
    if (!open) return;
    const onDoc = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", onDoc);
    return () => document.removeEventListener("mousedown", onDoc);
  }, [open]);

  // Focus search on open
  cbUseEffect(() => {
    if (open) {
      setQ("");
      setHighlight(Math.max(0, options.findIndex((o) => o.value === value)));
      requestAnimationFrame(() => searchRef.current?.focus());
    }
  }, [open]);

  // Keep highlighted item in view
  cbUseEffect(() => {
    if (!open) return;
    const list = listRef.current;
    if (!list) return;
    const el = list.querySelector(`[data-cbox-i="${highlight}"]`);
    if (el && el.scrollIntoView) {
      const r = el.getBoundingClientRect();
      const lr = list.getBoundingClientRect();
      if (r.top < lr.top) list.scrollTop -= lr.top - r.top;
      else if (r.bottom > lr.bottom) list.scrollTop += r.bottom - lr.bottom;
    }
  }, [highlight, open]);

  // Reset highlight when filter changes
  cbUseEffect(() => { setHighlight(0); }, [q]);

  const choose = (item) => {
    if (!item || item.disabled) return;
    onChange?.(item.value, item);
    setOpen(false);
  };

  const onKey = (e) => {
    if (!open) {
      if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") {
        e.preventDefault();
        setOpen(true);
      }
      return;
    }
    if (e.key === "Escape") { setOpen(false); e.preventDefault(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); setHighlight((h) => Math.min(filtered.length - 1, h + 1)); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); setHighlight((h) => Math.max(0, h - 1)); return; }
    if (e.key === "Enter") { e.preventDefault(); choose(filtered[highlight]); return; }
  };

  return (
    <div className={`cbox ${open ? "open" : ""} ${disabled ? "disabled" : ""} ${locked ? "locked" : ""}`} ref={wrapRef} style={{ width }}>
      <button
        type="button"
        className="cbox-trigger"
        onClick={() => !disabled && !locked && setOpen((v) => !v)}
        onKeyDown={onKey}
        disabled={disabled}
        aria-haspopup="listbox"
        aria-expanded={open}
      >
        {renderTrigger
          ? renderTrigger(selected, open)
          : (selected
              ? (
                <div className="cbox-selected">
                  {selected.leading && <div className="cbox-leading">{selected.leading}</div>}
                  <div className="cbox-meta">
                    <div className="cbox-t">{selected.label}</div>
                    {selected.sub && <div className="cbox-s">{selected.sub}</div>}
                  </div>
                </div>
              )
              : <div className="cbox-placeholder">{placeholder}</div>
            )
        }
        <div className="cbox-caret"><cbIcon.arrowDown /></div>
      </button>
      {open && (
        <div className="cbox-pop" role="listbox">
          <div className="cbox-search">
            <cbIcon.search />
            <input
              ref={searchRef}
              type="text"
              value={q}
              onChange={(e) => setQ(e.target.value)}
              onKeyDown={onKey}
              placeholder={searchPlaceholder}
            />
          </div>
          <div className="cbox-list" ref={listRef}>
            {filtered.length === 0 && <div className="cbox-empty">{emptyText}</div>}
            {filtered.map((o, i) => {
              const isSel = o.value === value;
              const isHi = i === highlight;
              return (
                <button
                  key={o.value}
                  type="button"
                  data-cbox-i={i}
                  role="option"
                  aria-selected={isSel}
                  className={`cbox-opt ${isSel ? "on" : ""} ${isHi ? "hi" : ""} ${o.disabled ? "disabled" : ""}`}
                  onMouseMove={() => setHighlight(i)}
                  onClick={() => choose(o)}
                  disabled={o.disabled}
                >
                  {renderOption
                    ? renderOption(o, isSel)
                    : (
                      <>
                        {o.leading && <div className="cbox-leading">{o.leading}</div>}
                        <div className="cbox-meta">
                          <div className="cbox-t">{o.label}</div>
                          {o.sub && <div className="cbox-s">{o.sub}</div>}
                        </div>
                        {isSel && <div className="cbox-check"><cbIcon.check /></div>}
                      </>
                    )
                  }
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

</script>

function SignUpScreen({ onSubmit, onSwitchToSignIn }) {
  const [email, setEmail] = useState("");
  const valid = email.includes("@") && email.includes(".");

  const submit = (e) => { e.preventDefault(); if (valid) onSubmit({ email }); };

  return (
    <AuthShell>
      <h1>Create your account</h1>
      <p className="lede">Enter your work email to get started</p>

      <form onSubmit={submit}>
        <div className="field">
          <label className="lbl">Work email</label>
          <input className="inp" type="email" placeholder="finance@acmetrading.com" value={email} onChange={(e)=>setEmail(e.target.value)} autoFocus />
        </div>

        <button className="btn btn-lg btn-block btn-dark" type="submit" disabled={!valid}>
          Continue
        </button>
      </form>

      <div className="auth-foot">
        Already have an account? <a onClick={onSwitchToSignIn}>Sign in</a>
      </div>
    </AuthShell>
  );
}

  "Nigeria", "Ghana", "Kenya", "Tanzania", "Mozambique",

function RegisterBusinessScreen({ email, onSubmit }) {
  const [fullName, setFullName] = useState("");
  const [bizName, setBizName] = useState("");
  const [country, setCountry] = useState("");
  const [agreed, setAgreed] = useState(false);

  const valid = fullName.trim().length > 1 && bizName.trim().length > 1 && country && agreed;
  const submit = (e) => { e.preventDefault(); if (valid) onSubmit({ fullName, bizName, country }); };

  return (
    <AuthShell>
      <h1>Set up your business</h1>
      <p className="lede">A few details to open your account</p>

      <form onSubmit={submit}>
        <div className="field">
          <label className="lbl">Your full name</label>
          <input className="inp" placeholder="Adaeze Okafor" value={fullName} onChange={(e)=>setFullName(e.target.value)} autoFocus />
        </div>
        <div className="field">
          <label className="lbl">Business name</label>
          <input className="inp" placeholder="Acme Trading Co" value={bizName} onChange={(e)=>setBizName(e.target.value)} />
        </div>
        <div className="field">
          <label className="lbl">Country of registration</label>
          <select className="inp" value={country} onChange={(e)=>setCountry(e.target.value)} style={{appearance:"auto"}}>
            <option value="">Select country</option>
            {SIGNUP_COUNTRIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>

        <label style={{display:"flex", gap:10, alignItems:"flex-start", margin:"6px 0 18px", fontSize: 12.5, color: "var(--gray-700)", lineHeight: 1.5, cursor:"pointer"}}>
          <input type="checkbox" checked={agreed} onChange={(e)=>setAgreed(e.target.checked)}
                 style={{marginTop: 2, width: 16, height: 16, accentColor: "#0F172A"}} />
          <span>I&rsquo;m authorised to open an account for this business and agree to the <a style={{color:"var(--info-700)", textDecoration:"none"}}>Terms</a> and <a style={{color:"var(--info-700)", textDecoration:"none"}}>Privacy Notice</a>.</span>
        </label>

        <button className="btn btn-lg btn-block btn-dark" type="submit" disabled={!valid}>
          Create account
        </button>
      </form>

      <div className="auth-foot" style={{fontSize: 12, color: "var(--gray-500)"}}>
        Signing up as <strong style={{color: "var(--gray-700)"}}>{email}</strong>
      </div>
    </AuthShell>
  );
}

function SignInScreen({ onSubmit, onSwitchToSignUp }) {
  const [email, setEmail] = useState("");
  const valid = email.includes("@") && email.includes(".");

  const submit = (e) => { e.preventDefault(); if (valid) onSubmit({ email }); };

  return (
    <AuthShell>
      <h1>Welcome back</h1>
      <p className="lede">Sign in below to continue</p>

      <form onSubmit={submit}>
        <div className="field">
          <label className="lbl">Email Address</label>
          <input className="inp" type="email" placeholder="finance@acmetrading.com" autoFocus
                 value={email} onChange={(e)=>setEmail(e.target.value)} />
        </div>
        <button className="btn btn-lg btn-block btn-dark" type="submit" disabled={!valid}>
          Sign in
        </button>
      </form>

      <div className="auth-foot">
        New to Onboard? <a onClick={onSwitchToSignUp}>Create account</a>
      </div>
    </AuthShell>
  );
}

// OTP entry — used for both sign-up + sign-in
// =====================================================
function OtpScreen({ email, mode, onSubmit, onChangeEmail, onResend }) {
  const [digits, setDigits] = useState(["", "", "", "", "", ""]);
  const [secs, setSecs] = useState(30);
  const refs = useRef([]);

  useEffect(() => {
    if (refs.current[0]) refs.current[0].focus();
  }, []);

  useEffect(() => {
    if (secs <= 0) return;
    const t = setTimeout(() => setSecs(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [secs]);

  const setAt = (i, v) => {
    const clean = v.replace(/[^0-9]/g, "");
    if (clean.length > 1) {
      // paste handling
      const arr = clean.slice(0, 6).split("");
      const next = ["", "", "", "", "", ""];
      arr.forEach((ch, idx) => { next[idx] = ch; });
      setDigits(next);
      const lastIdx = Math.min(arr.length, 5);
      if (refs.current[lastIdx]) refs.current[lastIdx].focus();
      return;
    }
    const next = [...digits]; next[i] = clean; setDigits(next);
    if (clean && i < 5 && refs.current[i+1]) refs.current[i+1].focus();
  };
  const onKey = (i, e) => {
    if (e.key === "Backspace" && !digits[i] && i > 0) refs.current[i-1].focus();
  };

  const code = digits.join("");
  const valid = code.length === 6;
  const submit = (e) => { e.preventDefault(); if (valid) onSubmit(code); };

  const resend = () => { onResend && onResend(); setSecs(30); };

  return (
    <AuthShell>
      <h1>{mode === "signup" ? "Verify your email" : "Enter your code"}</h1>
        <p className="lede">
          We sent a 6-digit code to <strong style={{color:"var(--gray-900)"}}>{email}</strong>.<br />
          It expires in 10 minutes.
        </p>

        <form onSubmit={submit}>
          <div className="otp-row">
            {digits.map((d, i) => (
              <input key={i}
                     ref={(el) => refs.current[i] = el}
                     className={`otp-cell ${d ? "filled" : ""}`}
                     inputMode="numeric" maxLength={1}
                     value={d}
                     onChange={(e) => setAt(i, e.target.value)}
                     onKeyDown={(e) => onKey(i, e)} />
            ))}
          </div>

          <div style={{textAlign:"center", margin:"18px 0 22px", fontSize: 12.5, color:"var(--gray-600)"}}>
            {secs > 0
              ? <>Didn&rsquo;t get it? Resend in <strong style={{color:"var(--gray-900)"}}>0:{String(secs).padStart(2,"0")}</strong></>
              : <a onClick={resend} style={{color:"var(--info-700)", cursor:"pointer", fontWeight: 500, textDecoration:"none"}}>Resend code</a>
            }
          </div>

          <button className="btn btn-lg btn-block btn-dark" type="submit" disabled={!valid}>
            {mode === "signup" ? "Verify and continue" : "Sign in"}
          </button>
        </form>

        <div className="auth-foot">
          Wrong email? <a onClick={onChangeEmail}>Use a different one</a>
        </div>
    </AuthShell>
  );
}

window.OBOnboarding = { SignUpScreen, SignInScreen, OtpScreen, RegisterBusinessScreen };

</script>

      <div className="addccy" onClick={(e) => e.stopPropagation()}>
        <button className="addccy-x" onClick={onClose}>×</button>
        <div className="addccy-head">
          <h3>Request other currencies</h3>
          <p>Let us know which currencies you need. We'll prioritise based on demand and email you when they're available.</p>
        </div>

        <div style={{padding: "0 24px 8px"}}>
          <div style={{fontSize: 11.5, fontWeight: 700, letterSpacing: "0.06em", color: "var(--gray-600)", textTransform: "uppercase", marginBottom: 12}}>
            Currencies
          </div>
          <div style={{display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 20}}>
            {WAITLIST_CURRENCIES.map((c) => {
              const on = selected.includes(c.code);
              return (
                <button key={c.code} onClick={() => toggle(c.code)} style={{
                  display: "inline-flex", alignItems: "center", gap: 8,
                  padding: "7px 14px", borderRadius: 8,
                  border: on ? "1.5px solid var(--info-600)" : "1.5px solid var(--gray-200)",
                  background: on ? "var(--info-50)" : "#fff",
                  color: on ? "var(--info-700)" : "var(--gray-700)",
                  fontSize: 13, fontWeight: 500, cursor: "pointer",
                }}>
                  <span className="ccy-flag" style={{width: 18, height: 18, backgroundImage: (window.__FLAGS__[c.flag] ? `url(${window.__FLAGS__[c.flag]})` : `url(design-system/assets/flags/${c.flag}.svg)`), borderRadius: "50%", flexShrink: 0}} />
                  {c.code}
                  <span style={{fontSize: 11, opacity: 0.7, fontWeight: 400}}>{c.name}</span>
                </button>
              );
            })}
          </div>

          <div style={{marginBottom: 16}}>
            <label style={{fontSize: 12.5, fontWeight: 500, color: "var(--gray-700)", display: "block", marginBottom: 6}}>
              Other currencies (optional)
            </label>
            <input className="inp" placeholder="e.g. CNY, ZAR, MXN" value={other} onChange={(e) => setOther(e.target.value)} />
          </div>

          <div style={{marginBottom: 8}}>
            <label style={{fontSize: 12.5, fontWeight: 500, color: "var(--gray-700)", display: "block", marginBottom: 6}}>
              Expected monthly volume (optional)
            </label>
            <select className="inp" value={volume} onChange={(e) => setVolume(e.target.value)} style={{appearance: "auto"}}>
              <option value="">Select range</option>
              <option value="<10k">Under $10,000</option>
              <option value="10-50k">$10,000 – $50,000</option>
              <option value="50-250k">$50,000 – $250,000</option>
              <option value=">250k">Over $250,000</option>
            </select>
          </div>
        </div>

        <div className="addccy-actions">
          <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn" disabled={selected.length === 0 && !other.trim()} onClick={() => setDone(true)}>
            Send request
          </button>
        </div>
      </div>
    </div>
  );
}

window.OBAccounts = {
  AccountsDashboard,
  CurrencyDetailRefBased,
  CurrencyDetailNamedAccounts,
  Toast,
  // re-exports for other screens
  Pill,
  TxRowDir,
  TxAmount,
  CopyInline,
  CcyFlag,
};

</script>

<script type="text/babel" data-file="screens-payments.jsx">
/* global React */
const { useState: useStateP, useMemo: useMemoP, useRef: useRefP, useEffect: useEffectP } = React;
const PIcon = window.OBIcon;
const { CURRENCIES: PCCY, RECIPIENTS_FULL } = window.OBData;

// =====================================================
// Recipient data
// =====================================================
const RECIPIENTS = RECIPIENTS_FULL;

const PAGE_SIZE = 8;

const REASONS = [
  "Supplier payment", "Payroll", "Contractor / freelancer",
  "Intercompany transfer", "Logistics & shipping",
  "Tax & government", "Refund", "Other",
];

const FX = { USD: 1, GBP: 0.79, EUR: 0.92, NGN: 1485.5, GHS: 14.2, KES: 129.4, TZS: 2640.0, MZN: 63.8 };
const FEE = { USD: 4.5, GBP: 3.6, EUR: 4.1 };
const SOURCES = ["USD", "GBP", "EUR"];
const DEST_OPTIONS = ["NGN", "GHS", "KES", "TZS", "MZN"];

function convert(src, dst, a) {
  const n = parseFloat(String(a).replace(/,/g, "")) || 0;
  if (!n) return 0;
  return (n / FX[src]) * FX[dst];
}
function fmt(n) {
  if (!n && n !== 0) return "0.00";
  return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Rate countdown — refreshes the indicated FX rate every 30s (mock)
function RateCountdown() {
  const [t, setT] = useStateP(30);
  useEffectP(() => {
    const id = setInterval(() => setT(x => x <= 1 ? 30 : x - 1), 1000);
    return () => clearInterval(id);
  }, []);
  return <span>{`Rate refreshes in ${t}s`}</span>;
}

// =====================================================
// Atoms
// =====================================================
function PFlag({ cc, size = 24 }) {
  return <div className="ccy-flag" style={{width: size, height: size, backgroundImage: (window.__FLAGS__[cc] ? `url(${window.__FLAGS__[cc]})` : `url(design-system/assets/flags/${cc}.svg)`)}} />;
}

function StepHeader({ steps, current }) {
  return (
    <div className="pay-stepper">
      {steps.map((s, i) => {
        const state = i < current ? "done" : i === current ? "active" : "todo";
        return (
          <React.Fragment key={s + i}>
            <div className={`pay-step ${state}`}>
              <div className="num">{state === "done" ? <PIcon.check /> : i + 1}</div>
              <div className="lbl">{s}</div>
            </div>
            {i < steps.length - 1 && <div className={`pay-step-bar ${i < current ? "done" : ""}`} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function CcyDropdown({ value, options, onChange }) {
  const [open, setOpen] = useStateP(false);
  return (
    <div className="ccy-dd">
      <button className="ccy-dd-btn" onClick={() => setOpen(!open)} type="button">
        <PFlag cc={PCCY[value].flag} size={18} />
        <span>{value}</span>
        <PIcon.arrowDown />
      </button>
      {open && (
        <>
          <div className="ccy-dd-veil" onClick={() => setOpen(false)} />
          <div className="ccy-dd-pop">
            {options.map((c) => (
              <button key={c} className={`ccy-dd-opt ${c === value ? "on" : ""}`}
                      onClick={() => { onChange(c); setOpen(false); }} type="button">
                <PFlag cc={PCCY[c].flag} size={18} />
                <span>{c}</span>
                <span className="muted">{PCCY[c].name}</span>
                {c === value && <PIcon.check />}
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// =====================================================
// Recipient picker (used standalone or as part of step 1 left pane)
// =====================================================
function RecipientPanel({ selectedId, onSelect, onAddNew, title = "Choose recipient", subtitle = "Select a saved recipient or add a new one" }) {
  const [q, setQ] = useStateP("");
  const [visible, setVisible] = useStateP(PAGE_SIZE);
  const sentinelRef = useRefP(null);

  const filtered = useMemoP(() => {
    const t = q.trim().toLowerCase();
    if (!t) return RECIPIENTS;
    return RECIPIENTS.filter(r =>
      r.name.toLowerCase().includes(t) ||
      r.handle.toLowerCase().includes(t) ||
      r.ccy.toLowerCase().includes(t)
    );
  }, [q]);

  useEffectP(() => { setVisible(PAGE_SIZE); }, [q]);

  useEffectP(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && visible < filtered.length) {
        setVisible(v => Math.min(v + PAGE_SIZE, filtered.length));
      }
    }, { root: el.closest('.recip-list') || null, rootMargin: '60px' });
    io.observe(el);
    return () => io.disconnect();
  }, [visible, filtered.length]);

  const list = filtered.slice(0, visible);
  const hasMore = visible < filtered.length;

  return (
    <div className="pay-panel">
      <div className="pay-panel-head">
        <div className="pay-panel-title">{title}</div>
        <div className="pay-panel-sub">{subtitle}</div>
      </div>

      <div className="pay-search">
        <PIcon.search />
        <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search by name, bank, or currency…" />
      </div>

      <button className="recip-add" onClick={onAddNew}>
        <span className="ic"><PIcon.plus /></span>
        <span className="t">Add new recipient</span>
        <PIcon.arrowRight />
      </button>

      {list.length === 0 ? (
        <div className="empty" style={{padding: "32px 16px"}}>
          <div className="ic"><PIcon.people /></div>
          <div style={{fontSize: 13, color: "var(--gray-700)", fontWeight: 500}}>No matches</div>
          <div style={{fontSize: 12, marginTop: 4}}>Try a different name or add a new recipient.</div>
        </div>
      ) : (
        <div className="recip-list" style={{maxHeight: 420, overflowY: "auto"}}>
          {list.map((r) => {
            const sel = r.id === selectedId;
            return (
              <button key={r.id} className={`recip-row ${sel ? "on" : ""}`} onClick={() => onSelect(r)}>
                <div className="ava">
                  <span>{r.name.split(" ").map(s => s[0]).slice(0, 2).join("")}</span>
                  <PFlag cc={r.country} size={14} />
                </div>
                <div className="meta">
                  <div className="t">{r.name}</div>
                  <div className="s">{`${r.handle} · ${r.type}`}</div>
                </div>
                <div className="rt">
                  <div className="ccy">{r.ccy}</div>
                  <div className="last">{`Last: ${r.last}`}</div>
                </div>
                {sel
                  ? <div className="selected-mark"><PIcon.check /></div>
                  : <div className="selected-spacer" />}
              </button>
            );
          })}
          {hasMore && (
            <div ref={sentinelRef} className="recip-loader">
              <span className="spin" /> Loading more recipients…
            </div>
          )}
          {!hasMore && filtered.length > PAGE_SIZE && (
            <div className="recip-end">All {filtered.length} recipients shown</div>
          )}
        </div>
      )}
    </div>
  );
}

// =====================================================
// Amount panel (full or compact)
// =====================================================
function AmountPanel({
  recipient, srcCcy, setSrcCcy, dstCcy, setDstCcy,
  amount, setAmount, reason, setReason, memo, setMemo,
  title = "Amount to send",
  subtitle,
  showRecipientHeader = false,
}) {
  const dst = recipient ? recipient.ccy : dstCcy;
  const dstReceive = convert(srcCcy, dst, amount);
  const rate = FX[dst] / FX[srcCcy];
  const fee = FEE[srcCcy] || 0;

  return (
    <div className="pay-panel">
      <div className="pay-panel-head">
        <div className="pay-panel-title">{title}</div>
        <div className="pay-panel-sub">{subtitle || (recipient ? `Sending to ${recipient.name}` : "Choose currencies and enter an amount")}</div>
      </div>

      {showRecipientHeader && recipient && (
        <div className="pay-recip-strip">
          <div className="ava">
            <span>{recipient.name.split(" ").map(s => s[0]).slice(0, 2).join("")}</span>
            <PFlag cc={recipient.country} size={14} />
          </div>
          <div className="meta">
            <div className="t">{recipient.name}</div>
            <div className="s">{recipient.handle}</div>
          </div>
          <div className="rt">{recipient.ccy}</div>
        </div>
      )}

      <div className="pay-fx">
        <div className="pay-fx-row">
          <div className="lb">If you send</div>
          <div className="amt-box">
            <input className="amt-inp" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" />
            <CcyDropdown value={srcCcy} options={SOURCES} onChange={setSrcCcy} />
          </div>
          <div className="hint">{`From your ${srcCcy} balance`}</div>
        </div>

        <div className="pay-fx-divider"><PIcon.arrowDown /></div>

        <div className="pay-fx-row">
          <div className="lb">They will receive</div>
          <div className="amt-box read">
            <div className="amt-read">{fmt(dstReceive)}</div>
            {recipient ? (
              <div className="ccy-locked">
                <PFlag cc={recipient.country} size={18} /> {dst}
              </div>
            ) : (
              <CcyDropdown value={dstCcy} options={DEST_OPTIONS} onChange={setDstCcy} />
            )}
          </div>
          <div className="hint">
            <span className="rate"><span className="rate-pulse" /> {`1 ${srcCcy} ≈ ${rate.toFixed(rate < 5 ? 4 : 2)} ${dst}`}</span>
            <span className="rate-refresh"><RateCountdown /></span>
            <span className="rate-fee">{`Fee · ${srcCcy} ${fee.toFixed(2)}`}</span>
          </div>
        </div>
      </div>

      <div className="pay-fields">
        <div className="field" style={{marginBottom: 14}}>
          <div className="lbl">Reason for payment <span className="req">· required</span></div>
          <select className="inp pay-select" value={reason} onChange={(e) => setReason(e.target.value)}>
            <option value="">Select a reason…</option>
            {REASONS.map(r => <option key={r} value={r}>{r}</option>)}
          </select>
        </div>
        <div className="field" style={{marginBottom: 0}}>
          <div className="lbl">Memo <span className="opt">· optional</span></div>
          <textarea className="inp pay-memo" maxLength={120} rows={2}
            placeholder="Add a note for your records (visible on the transaction)"
            value={memo} onChange={(e) => setMemo(e.target.value)} />
          <div className="help" style={{textAlign: "right", fontVariantNumeric: "tabular-nums"}}>{`${memo.length}/120`}</div>
        </div>
      </div>
    </div>
  );
}

// =====================================================
// Placeholder panel (right-side of step 1 before the gating action)
// =====================================================
function StepOnePlaceholder({ mode }) {
  const isRecipFirst = mode === "recipient";
  return (
    <div className="pay-panel placeholder">
      <div className="pay-panel-head">
        <div className="pay-panel-title muted">{isRecipFirst ? "Amount to send" : "Choose recipient"}</div>
        <div className="pay-panel-sub">{isRecipFirst ? "Will appear after you choose a recipient" : "Will appear after you set the amount"}</div>
      </div>
      <div className="pay-empty">
        <div className="ic">{isRecipFirst ? <PIcon.paperplane /> : <PIcon.people />}</div>
        <div className="t">{isRecipFirst ? "Select a recipient to continue" : "Set an amount to continue"}</div>
        <div className="s">
          {isRecipFirst
            ? "Pick from your saved recipients on the left, or add a new one. We'll set up the right currency and rails automatically."
            : "Enter an amount on the left. Once you do, we'll show your saved recipients filtered to the destination currency."}
        </div>
        <div className="dotted-fields">
          <div className="dotted-row" />
          <div className="dotted-row short" />
          <div className="dotted-row" />
        </div>
      </div>
    </div>
  );
}

// =====================================================
// UNIFIED Send Payment flow
// =====================================================
function SendPayment({ onAddRecipient, onToast, defaultMode = "recipient", paymentApproval = "required", paymentApprovalMethod = "totp", accountSuspended = false }) {
  const [mode, setMode] = useStateP(defaultMode); // "recipient" | "amount"
  const [step, setStep] = useStateP(0);            // 0 form | 1 review | 2 approve | 3 confirmation

  if (accountSuspended) {
    return (
      <div className="page">
        <div className="page-head">
          <div><h1 className="title">Send payment</h1></div>
        </div>
        <div className="card" style={{padding: "64px 32px", textAlign: "center", maxWidth: 520, marginInline: "auto"}}>
          <div style={{
            width: 56, height: 56, borderRadius: 14, background: "#FEF2F2", color: "#DC2626",
            display: "grid", placeItems: "center", marginBottom: 18, marginInline: "auto",
            fontSize: 26, fontWeight: 700,
          }}>!</div>
          <div style={{fontSize: 18, fontWeight: 600, color: "var(--gray-900)", marginBottom: 6}}>
            Outbound payments disabled
          </div>
          <div style={{fontSize: 13.5, color: "var(--gray-600)", maxWidth: 400, lineHeight: 1.6, marginInline: "auto"}}>
            Your account is currently suspended. Inbound funds will continue to settle, but new payouts can&rsquo;t be initiated until the suspension is lifted. Contact support for next steps.
          </div>
          <button className="btn" style={{marginTop: 22}}>Contact support</button>
        </div>
      </div>
    );
  }
  const [recipient, setRecipient] = useStateP(null);
  const [srcCcy, setSrcCcy] = useStateP("USD");
  const [dstCcy, setDstCcy] = useStateP("NGN");
  const [amount, setAmount] = useStateP("");
  const [reason, setReason] = useStateP("");
  const [memo, setMemo] = useStateP("");
  const [reference, setReference] = useStateP(null);

  // Switching modes resets step 1 partial state on the right pane to avoid cross-contamination
  const switchMode = (m) => {
    if (m === mode) return;
    setMode(m);
    setStep(0);
  };

  const stepLabels = mode === "recipient"
    ? (paymentApproval === "required" ? ["Recipient & amount", "Review", "Approve", "Done"] : ["Recipient & amount", "Review", "Done"])
    : (paymentApproval === "required" ? ["Amount & recipient", "Review", "Approve", "Done"] : ["Amount & recipient", "Review", "Done"]);

  const dstFinal = recipient ? recipient.ccy : dstCcy;
  const amtNum = parseFloat(String(amount).replace(/,/g,"")) || 0;

  // For recipient-first: right pane unlocks once recipient selected
  // For amount-first:    right pane unlocks once amount > 0
  const rightUnlocked = mode === "recipient" ? !!recipient : amtNum > 0;
  const canReview = !!recipient && amtNum > 0 && !!reason;

  const goReview = () => { if (canReview) setStep(1); };
  const goApprove = () => {
    if (paymentApproval === "required") setStep(2);
    else doConfirm();
  };
  const doConfirm = () => {
    setReference("PAY-2026-" + String(Math.floor(Math.random() * 90000) + 10000));
    setStep(paymentApproval === "required" ? 3 : 2);
  };
  // legacy hook
  const confirm = doConfirm;
  const reset = () => {
    setStep(0); setRecipient(null); setSrcCcy("USD"); setDstCcy("NGN");
    setAmount(""); setReason(""); setMemo(""); setReference(null);
  };

  const leftPane = mode === "recipient" ? (
    <RecipientPanel
      selectedId={recipient?.id}
      onSelect={(r) => { setRecipient(r); setDstCcy(r.ccy); }}
      onAddNew={onAddRecipient}
      title="1 · Choose recipient"
      subtitle="Pick a saved recipient or add a new one" />
  ) : (
    <AmountInputOnlyPanel
      srcCcy={srcCcy} setSrcCcy={setSrcCcy}
      dstCcy={dstCcy} setDstCcy={setDstCcy}
      amount={amount} setAmount={setAmount}
      title="1 · Enter amount"
      subtitle="Set source and destination currencies, then the amount" />
  );

  const rightPane = !rightUnlocked ? (
    <StepOnePlaceholder mode={mode} />
  ) : mode === "recipient" ? (
    <AmountPanelRight
      recipient={recipient} srcCcy={srcCcy} setSrcCcy={setSrcCcy}
      amount={amount} setAmount={setAmount}
      reason={reason} setReason={setReason}
      memo={memo} setMemo={setMemo}
      title="2 · Amount to send"
      onReview={goReview} canReview={canReview} />
  ) : (
    <RecipientPanelFiltered
      destCcy={dstCcy}
      selectedId={recipient?.id}
      onSelect={setRecipient}
      reason={reason} setReason={setReason}
      memo={memo} setMemo={setMemo}
      onAddNew={onAddRecipient}
      title="2 · Choose recipient"
      onReview={goReview} canReview={canReview} />
  );

  return (
    <div className="page pay-flow">
      <h1 className="title">Send payment</h1>
      <p className="subtitle">Move money to suppliers, payroll, and partners across the world.</p>

      <StepHeader steps={stepLabels} current={step} />

      {step === 0 && (
        <>
          <div className="pay-grid">
            {leftPane}
            {rightPane}
          </div>
        </>
      )}

      {step === 1 && (
        <ReviewPayment
          payment={{
            recipient, srcCcy, dstCcy: dstFinal, amount, reason, memo,
            receive: convert(srcCcy, dstFinal, amount),
            fee: FEE[srcCcy] || 0,
          }}
          requiresApproval={paymentApproval === "required"}
          onBack={() => setStep(0)}
          onConfirm={goApprove} />
      )}

      {step === 2 && paymentApproval === "required" && (
        <PaymentApprovalStep
          method={paymentApprovalMethod}
          payment={{
            recipient, srcCcy, dstCcy: dstFinal, amount,
            receive: convert(srcCcy, dstFinal, amount),
          }}
          onBack={() => setStep(1)}
          onApprove={doConfirm}
          onToast={onToast} />
      )}

      {((step === 2 && paymentApproval === "off") || step === 3) && (
        <SendConfirmation
          payment={{
            recipient, srcCcy, dstCcy: dstFinal, amount, reason, memo,
            receive: convert(srcCcy, dstFinal, amount),
            fee: FEE[srcCcy] || 0,
          }}
          reference={reference}
          onDone={() => onToast && onToast("Transaction details — phase 2")}
          onNewPayment={reset} />
      )}
    </div>
  );
}

// Right-pane variant: amount + reason + memo (recipient already chosen)
function AmountPanelRight({ recipient, srcCcy, setSrcCcy, amount, setAmount, reason, setReason, memo, setMemo, title, onReview, canReview }) {
  const dst = recipient.ccy;
  const dstReceive = convert(srcCcy, dst, amount);
  const rate = FX[dst] / FX[srcCcy];
  const fee = FEE[srcCcy] || 0;
  return (
    <div className="pay-panel">
      <div className="pay-panel-head">
        <div className="pay-panel-title">{title}</div>
        <div className="pay-panel-sub">{`Sending to ${recipient.name}`}</div>
      </div>

      <div className="pay-recip-strip">
        <div className="ava">
          <span>{recipient.name.split(" ").map(s => s[0]).slice(0, 2).join("")}</span>
          <PFlag cc={recipient.country} size={14} />
        </div>
        <div className="meta">
          <div className="t">{recipient.name}</div>
          <div className="s">{recipient.handle}</div>
        </div>
        <div className="rt">{recipient.ccy}</div>
      </div>

      <div className="pay-fx">
        <div className="pay-fx-row">
          <div className="lb">If you send</div>
          <div className="amt-box">
            <input className="amt-inp" inputMode="decimal" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" />
            <CcyDropdown value={srcCcy} options={SOURCES} onChange={setSrcCcy} />
          </div>
          <div className="hint">{`From your ${srcCcy} balance`}</div>
        </div>
        <div className="pay-fx-divider"><PIcon.arrowDown /></div>
        <div className="pay-fx-row">
          <div className="lb">They will receive</div>
          <div className="amt-box read">
            <div className="amt-read">{fmt(dstReceive)}</div>
            <div className="ccy-locked">
              <PFlag cc={recipient.country} size={18} /> {dst}
            </div>
          </div>
          <div className="hint">
            <span className="rate"><span className="rate-pulse" /> {`1 ${srcCcy} ≈ ${rate.toFixed(rate < 5 ? 4 : 2)} ${dst}`}</span>
            <span className="rate-refresh"><RateCountdown /></span>
            <span className="rate-fee">{`Fee · ${srcCcy} ${fee.toFixed(2)}`}</span>
          </div>
        </div>
      </div>

      <ReasonMemoFields reason={reason} setReason={setReason} memo={memo} setMemo={setMemo} />

      <button className="btn btn-lg" style={{marginTop: 18, width: "100%", justifyContent: "center"}} disabled={!canReview} onClick={onReview}>
        Review payment <PIcon.arrowRight />
      </button>
    </div>
  );
}

// Right pane for amount-first: filtered recipient list + reason/memo below
function RecipientPanelFiltered({ destCcy, selectedId, onSelect, reason, setReason, memo, setMemo, onAddNew, title, onReview, canReview }) {
  const [q, setQ] = useStateP("");
  const [visible, setVisible] = useStateP(PAGE_SIZE);
  const sentinelRef = useRefP(null);

  const filtered = useMemoP(() => {
    let res = RECIPIENTS.filter(r => r.ccy === destCcy);
    const t = q.trim().toLowerCase();
    if (t) res = res.filter(r => r.name.toLowerCase().includes(t) || r.handle.toLowerCase().includes(t));
    return res;
  }, [q, destCcy]);

  useEffectP(() => { setVisible(PAGE_SIZE); }, [q, destCcy]);

  useEffectP(() => {
    const el = sentinelRef.current;
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && visible < filtered.length) {
        setVisible(v => Math.min(v + PAGE_SIZE, filtered.length));
      }
    }, { root: el.closest('.recip-list') || null, rootMargin: '60px' });
    io.observe(el);
    return () => io.disconnect();
  }, [visible, filtered.length]);

  const list = filtered.slice(0, visible);
  const hasMore = visible < filtered.length;

  return (
    <div className="pay-panel">
      <div className="pay-panel-head">
        <div className="pay-panel-title">{title}</div>
        <div className="pay-panel-sub">{`Showing recipients that can receive ${destCcy}`}</div>

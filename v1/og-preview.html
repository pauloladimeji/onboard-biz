<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Open Graph / social-share image source — derived 1:1 from the demo entry hero
  (DemoEntryScreen in app.jsx / .demo-entry-hero in app.css). Sized exactly to the
  1200×630 OG canvas. Screenshot it and save over v0/design-system/assets/og-image.png,
  which the meta tags in v1/index.html and v0/index.html already point at.

  How to capture (from the repo root, with the demo already being served):
    python3 -m http.server 8080
    open http://localhost:8080/v1/og-preview.html   (browser viewport 1200×630, zoom 100%)
  then screenshot the page (2400×1260 on a 2× / retina display is ideal) and overwrite
  v0/design-system/assets/og-image.png.

  Headless one-liner (Chromium reserves ~70px of window chrome, so render taller and crop):
    chromium --headless --force-device-scale-factor=2 --window-size=1200,760 \
      --hide-scrollbars --screenshot=raw.png file://$PWD/v1/og-preview.html
    # then crop the top 2400×1260 of raw.png -> og-image.png
-->
<title>Onboard Business — OG image preview</title>
<style>
@font-face {
  font-family: "Euclid Circular A";
  src: url("../v0/design-system/fonts/EuclidCircularA-Light.woff") format("woff");
  font-weight: 300; font-style: normal; font-display: block;
}
@font-face {
  font-family: "Euclid Circular A";
  src: url("../v0/design-system/fonts/EuclidCircularA-Regular.woff") format("woff");
  font-weight: 400; font-style: normal; font-display: block;
}
@font-face {
  font-family: "Euclid Circular A";
  src: url("../v0/design-system/fonts/EuclidCircularA-Medium.woff") format("woff");
  font-weight: 500; font-style: normal; font-display: block;
}
@font-face {
  font-family: "Feature Display Trial";
  src: url("../v0/design-system/fonts/FeatureDisplay-Regular-Trial.otf") format("opentype");
  font-weight: 400; font-style: normal; font-display: block;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; }
body {
  font-family: "Euclid Circular A", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---- Demo entry hero (port of .demo-entry.demo-entry-hero) ---- */
.hero {
  position: relative; width: 1200px; height: 630px; overflow: hidden;
  background: #0c1a2e;
}
.hero-photo {
  position: absolute; inset: 0; z-index: 0;
  background-image: url("../v0/design-system/assets/demo-entry-hero.jpg");
  background-size: cover; background-position: center 28%;
}
.hero-scrim {
  position: absolute; left: 0; right: 0; bottom: 0; height: 62%; z-index: 1;
  background: linear-gradient(180deg, rgba(12,26,46,0) 0%, rgba(12,26,46,.82) 100%);
}
.hero-accent {
  position: absolute; right: -20px; bottom: -30px; width: 46%; height: auto;
  z-index: 1; pointer-events: none; opacity: 0.96;
}
.hero-logo {
  position: absolute; top: 46px; left: 64px; z-index: 3;
}
.hero-logo svg { height: 26px; width: auto; display: block; color: #fff; }

/* ---- Floating card (port of .demo-entry-card-shell / .demo-entry-card) ---- */
.card-shell {
  position: absolute; z-index: 2; top: 118px; left: 64px; width: 452px;
}
.card-shell::before {
  content: ""; position: absolute; left: 6px; right: 6px; bottom: -10px; height: 40px;
  background: #C6FF00; border-radius: 16px; z-index: 0;
}
.card {
  position: relative; z-index: 1;
  background: #fff; border-radius: 16px; padding: 30px 34px;
  box-shadow: 0 12px 40px rgba(12,26,46,.28);
  display: flex; flex-direction: column; align-items: stretch; text-align: center;
}
.eyebrow {
  align-self: center; display: inline-flex; align-items: center; gap: 8px;
  background: #fff; color: #1D1700;
  box-shadow: 0 0 0 1px #1D1700, inset 0 -2px 6px rgba(255,255,255,.1);
  font-size: 13px; font-weight: 500; padding: 8px 16px 8px 14px;
  border-radius: 999px; margin-bottom: 16px;
}
.dot { position: relative; width: 8px; height: 8px; flex-shrink: 0; }
.dot-core { position: absolute; inset: 0; border-radius: 50%; background: #FF3600; }
.card h1 {
  font-family: "Feature Display Trial", Georgia, serif;
  font-size: 32px; font-weight: 400; color: #000; margin: 0 0 12px;
  line-height: 1.2; letter-spacing: -0.01em;
}
.lede { font-size: 13.5px; color: #A0AEC0; margin: 0 0 20px; line-height: 1.55; }
.features {
  display: flex; flex-direction: column; gap: 12px; text-align: left;
  background: #FAFAFA; border-radius: 10px; padding: 16px; margin-bottom: 22px;
}
.feature { display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: #000; font-weight: 300; }
.feature svg { flex-shrink: 0; }
.cta {
  display: flex; align-items: center; justify-content: center;
  background: #0F172A; color: #fff; border-radius: 12px;
  padding: 14px 18px; font-size: 14px; font-weight: 500; letter-spacing: 0.02rem;
}
</style>
</head>
